name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    # Windows is where the plugin is developed; Linux is the common CI default.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Show version
        run: claude --version
      - name: Validate plugin
        run: claude plugin validate . --strict
      - name: Test plugin
        run: claude plugin test .
